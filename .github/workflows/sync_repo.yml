name: Sync Repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 最小权限：本任务只需要读源码，不写 GitHub 侧任何资源。
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    name: Sync Repository
    steps:
      # 按 commit SHA 固定（见 build-verify.yml 的说明）：本任务持有
      # GITEE_SSH_PRIVATE_KEY，绝不能让浮动标签的上游变更决定它的执行环境。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup SSH
        env:
          GITEE_SSH_PRIVATE_KEY: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
          # 可选：覆盖内置的 Gitee known_hosts（默认已固定官方主机公钥）。
          GITEE_KNOWN_HOSTS: ${{ secrets.GITEE_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # 私钥经 env 传入而不是内插到 run: 脚本里：内插会在 shell 展开前把
          # 密钥文本拼进脚本本体，含元字符时即为命令执行。
          printf '%s\n' "$GITEE_SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          if [ -n "${GITEE_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$GITEE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # 默认固定 Gitee 官方主机公钥，避免 ssh-keyscan 的 TOFU 中间人窗口。
            # 指纹（SHA256）：
            #   ED25519 +ULzij2u99B9eWYFTw1Q4ErYG/aepHLbu96PAUCoV88
            #   ECDSA   FQGC9Kn/eye1W8icdBgrQp+KkGYoFgbVr17bmjey0Wc
            #   RSA     meTsVSCgOas8fBnJyx8EPlUJr6iQ96riFmCFPfUkDtU
            # 如 Gitee 轮换主机密钥，更新此处或配置 GITEE_KNOWN_HOSTS secret。
            cat > ~/.ssh/known_hosts <<'KNOWN_HOSTS'
gitee.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEKxHSJ7084RmkJ4YdEi5tngynE8aZe2uEoVVsB/OvYN
gitee.com ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBMuEoYdx6to5oxR60IWj8uoe1aI0X1fKOHWOtLqTg1tsLT1iFwXV5JmFjU46EzeMBV/6EmI1uaRI6HiEPtPtJHE=
gitee.com ssh-rsa 
KNOWN_HOSTS
          fi

      - name: Create single commit and push
        env:
          GITEE_REPO_URL: ${{ vars.GITEE_REPO_URL }}
        run: |
          set -euo pipefail
          # 仓库地址是仓库变量（可被有写权限者修改）：先校验协议，再作为参数
          # 交给 git，避免被解析成额外参数或命令。
          case "$GITEE_REPO_URL" in
            https://* | ssh://* | git@*) ;;
            *)
              echo "invalid GITEE_REPO_URL: must be https://, ssh:// or git@…" >&2
              exit 1
              ;;
          esac

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Create a new branch
          git checkout --orphan new-main
          git add .
          git commit -m "Sync from GitHub: $(date)"

          # Add Gitee remote and force push
          git remote add gitee "$GITEE_REPO_URL"
          git push --force gitee new-main:main
